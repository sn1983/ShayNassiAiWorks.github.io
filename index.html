<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gallery - ShayNassiAiWorks</title>
  <style>
    /* ... הגדרות קודמות נשמרות ... */
    :root {
      --bg-color: #0a0a0a;
      --card-bg: #161616;
      --accent-color: #00d4ff;
      --text-main: #ffffff;
      --text-secondary: #a0a0a0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      margin: 0;
      background: var(--bg-color);
      color: var(--text-main);
    }

    .center { max-width: 1400px; margin: 0 auto; padding: 40px 20px; }
    header { text-align: center; margin-bottom: 50px; }
    h1 { 
        text-align: center; font-size: 2.5rem; margin-bottom: 40px;
        background: linear-gradient(90deg, #fff, var(--accent-color));
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
    }

    .item {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      aspect-ratio: 1 / 1;
      border: 1px solid #222;
      transition: all 0.4s ease;
      cursor: pointer;
    }

    .item:hover {
      transform: translateY(-8px);
      border-color: var(--accent-color);
    }

    .item img, .item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* אייקון "Play" לסרטונים בגלריה */
    .video-badge::after {
      content: '▶';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 3rem;
      color: white;
      text-shadow: 0 0 20px rgba(0,0,0,0.5);
      opacity: 0.8;
    }

    .loader { text-align: center; padding: 100px; color: var(--accent-color); }
    
    /* מודל משופר */
    .modal {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(8px); display: none;
      align-items: center; justify-content: center; z-index: 1000;
    }
    .modal.open { display: flex; }
    .modal-content { max-width: 90%; max-height: 90vh; position: relative; }
    .modal img, .modal video { width: 100%; height: auto; max-height: 90vh; border-radius: 8px; }

    .close {
      position: absolute; right: -40px; top: -40px;
      color: #fff; font-size: 35px; cursor: pointer;
    }

    @media (max-width: 600px) {
      .gallery { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
      .close { right: 10px; top: 10px; }
    }
  </style>
</head>
<body>
  <div class="center">
    <h1>Shay Nassi AiWorks - גלריה</h1>
    <div id="loader" class="loader">מחפש קבצים...</div>
    <div id="gallery" class="gallery"></div>
