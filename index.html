<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gallery - ShayNassiAiWorks</title>
  <style>
    :root {
      --bg-color: #0d0d0d;
      --card-bg: #1a1a1a;
      --accent-color: #00d4ff;
      --text-main: #ffffff;
      --text-secondary: #b0b0b0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      margin: 0;
      background: var(--bg-color);
      color: var(--text-main);
      line-height: 1.5;
    }

    .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
    
    header { text-align: center; margin-bottom: 50px; }
    h1 { 
      font-size: 2.5rem; margin: 0; 
      background: linear-gradient(135deg, #fff 0%, var(--accent-color) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .subtitle { color: var(--text-secondary); margin-top: 10px; }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
    }

    .item {
      position: relative;
      background: var(--card-bg);
      border-radius: 8px;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid #333;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .item:hover {
      transform: scale(1.02);
      border-color: var(--accent-color);
    }

    .item img, .item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* אינדיקטורים */
    .overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.4);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.2s;
      color: white; font-size: 0.9rem; font-weight: bold;
    }
    .item:hover .overlay { opacity: 1; }

    .badge {
      position: absolute; top: 10px; left: 10px;
      background: rgba(0,0,0,0.6); padding: 2px 8px;
      border-radius: 4px; font-size: 11px; color: var(--accent-color);
      z-index: 5; border: 1px solid var(--accent-color);
    }

    /* מודל (הצצה גדולה) */
    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.9);
      display: none; align-items: center; justify-content: center;
      z-index: 9999; padding: 20px;
    }
    .modal.active { display: flex; }
    .modal-content { max-width: 95%; max-height: 90vh; position: relative; }
    .modal-content img, .modal-content video { 
      max-width: 100%; max-height: 90vh; border-radius: 4px; 
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }
    .close-btn {
      position: absolute; top: -40px; right: 0;
      color: white; font-size: 30px; cursor: pointer;
    }

    .loader { text-align: center; padding: 50px; color: var(--accent-color); }

    @media (max-width: 600px) {
      .gallery { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
      h1 { font-size: 1.8rem; }
    }
  </style>
</head
