<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gallery - ShayNassiAiWorks</title>
  <style>
    :root {
      --bg-color: #0d0d0d;
      --card-bg: #1a1a1a;
      --accent-color: #00d4ff;
      --text-main: #ffffff;
      --text-secondary: #b0b0b0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      margin: 0;
      background: var(--bg-color);
      color: var(--text-main);
      line-height: 1.5;
    }

    .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
    
    header { text-align: center; margin-bottom: 50px; }
    h1 { 
      font-size: 2.5rem; margin: 0; 
      background: linear-gradient(135deg, #fff 0%, var(--accent-color) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .subtitle { color: var(--text-secondary); margin-top: 10px; }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
    }

    .item {
      position: relative;
      background: var(--card-bg);
      border-radius: 8px;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid #333;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .item:hover {
      transform: scale(1.02);
      border-color: var(--accent-color);
    }

    .item img, .item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* אינדיקטורים */
    .overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.4);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.2s;
      color: white; font-size: 0.9rem; font-weight: bold;
    }
    .item:hover .overlay { opacity: 1; }

    .badge {
      position: absolute; top: 10px; left: 10px;
      background: rgba(0,0,0,0.6); padding: 2px 8px;
      border-radius: 4px; font-size: 11px; color: var(--accent-color);
      z-index: 5; border: 1px solid var(--accent-color);
    }

    /* מודל (הצצה גדולה) */
    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.9);
      display: none; align-items: center; justify-content: center;
      z-index: 9999; padding: 20px;
    }
    .modal.active { display: flex; }
    .modal-content { max-width: 95%; max-height: 90vh; position: relative; }
    .modal-content img, .modal-content video { 
      max-width: 100%; max-height: 90vh; border-radius: 4px; 
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }
    .close-btn {
      position: absolute; top: -40px; right: 0;
      color: white; font-size: 30px; cursor: pointer;
    }

    .loader { text-align: center; padding: 50px; color: var(--accent-color); }

    @media (max-width: 600px) {
      .gallery { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
      h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Shay Nassi AiWorks</h1>
      <p class="subtitle">גלריית יצירות AI - תמונות ווידאו</p>
    </header>

    <div id="loader" class="loader">מתחבר למאגר הקבצים...</div>
    <div id="gallery" class="gallery"></div>
  </div>

  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" id="closeBtn">✕</span>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    const CONFIG = {
      owner: 'sn1983',
      repo: 'ShayNassiAiWorks.github.io',
      branch: 'main'
    };

    const galleryEl = document.getElementById('gallery');
    const loaderEl = document.getElementById('loader');
    const modalEl = document.getElementById('modal');
    const modalBody = document.getElementById('modalBody');

    // פונקציה לבניית כתובת הקובץ דרך CDN להזרמה מהירה
    function getUrl(path) {
      return `https://cdn.jsdelivr.net/gh/${CONFIG.owner}/${CONFIG.repo}@${CONFIG.branch}/${path}`;
    }

    async function fetchFiles(path = '') {
      const response = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${path}`);
      const data = await response.json();
      let files = [];

      for (let item of data) {
        if (item.type === 'dir') {
          const subFiles = await fetchFiles(item.path);
          files = files.concat(subFiles);
        } else {
          const ext = item.name.split('.').pop().toLowerCase();
          const images = ['jpg', 'jpeg', 'png', 'webp', 'gif'];
          const videos = ['mp4', 'webm', 'mov'];
          
          if (images.includes(ext)) {
            files.push({ type: 'image', url: getUrl(item.path), name: item.name });
          } else if (videos.includes(ext)) {
            files.push({ type: 'video', url: getUrl(item.path), name: item.name });
          }
        }
      }
      return files;
    }

    function createItem(file) {
      const div = document.createElement('div');
      div.className = 'item';
      
      const badge = document.createElement('div');
      badge.className = 'badge';
      badge.textContent = file.type === 'video' ? 'VIDEO' : 'IMG';
      div.appendChild(badge);

      let media;
      if (file.type === 'image') {
        media = document.createElement('img');
        media.loading = 'lazy';
      } else {
        media = document.createElement('video');
        media.muted = true;
        media.playsInline = true;
        // טוען פריים קטן לתצוגה מקדימה
        file.url += "#t=0.1";
      }
      media.src = file.url;
      
      const overlay = document.createElement('div');
      overlay.className = 'overlay';
      overlay.textContent = file.type === 'video' ? '▶ נגן וידאו' : '🔍 הגדל';

      div.appendChild(media);
      div.appendChild(overlay);
      div.onclick = () => openModal(file);
      
      return div;
    }

    function openModal(file) {
      modalBody.innerHTML = '';
      let content;
      if (file.type === 'image') {
        content = document.createElement('img');
      } else {
        content = document.createElement('video');
        content.controls = true;
        content.autoplay = true;
      }
      content.src = file.url.replace("#t=0.1", ""); // הסרת תגית התצוגה המקדימה בנגן המלא
      modalBody.appendChild(content);
      modalEl.classList.add('active');
    }

    document.getElementById('closeBtn').onclick = () => {
      modalEl.classList.remove('active');
      modalBody.innerHTML = '';
    };

    modalEl.onclick = (e) => { if(e.target === modalEl) document.getElementById('closeBtn').onclick(); };

    // אתחול
    fetchFiles().then(files => {
      loaderEl.style.display = 'none';
      files.forEach(file => galleryEl.appendChild(createItem(file)));
    }).catch(err => {
      loaderEl.textContent = 'שגיאה בטעינת הקבצים. וודא שהמאגר ציבורי.';
      console.error(err);
    });

  </script>
</body>
</html>
