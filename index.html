<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gallery - ShayNassiAiWorks</title>
  <style>
    /* ... הגדרות קודמות נשמרות ... */
    :root {
      --bg-color: #0a0a0a;
      --card-bg: #161616;
      --accent-color: #00d4ff;
      --text-main: #ffffff;
      --text-secondary: #a0a0a0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      margin: 0;
      background: var(--bg-color);
      color: var(--text-main);
    }

    .center { max-width: 1400px; margin: 0 auto; padding: 40px 20px; }
    header { text-align: center; margin-bottom: 50px; }
    h1 { 
        text-align: center; font-size: 2.5rem; margin-bottom: 40px;
        background: linear-gradient(90deg, #fff, var(--accent-color));
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
    }

    .item {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      aspect-ratio: 1 / 1;
      border: 1px solid #222;
      transition: all 0.4s ease;
      cursor: pointer;
    }

    .item:hover {
      transform: translateY(-8px);
      border-color: var(--accent-color);
    }

    .item img, .item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* אייקון "Play" לסרטונים בגלריה */
    .video-badge::after {
      content: '▶';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 3rem;
      color: white;
      text-shadow: 0 0 20px rgba(0,0,0,0.5);
      opacity: 0.8;
    }

    .loader { text-align: center; padding: 100px; color: var(--accent-color); }
    
    /* מודל משופר */
    .modal {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(8px); display: none;
      align-items: center; justify-content: center; z-index: 1000;
    }
    .modal.open { display: flex; }
    .modal-content { max-width: 90%; max-height: 90vh; position: relative; }
    .modal img, .modal video { width: 100%; height: auto; max-height: 90vh; border-radius: 8px; }

    .close {
      position: absolute; right: -40px; top: -40px;
      color: #fff; font-size: 35px; cursor: pointer;
    }

    @media (max-width: 600px) {
      .gallery { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
      .close { right: 10px; top: 10px; }
    }
  </style>
</head>
<body>
  <div class="center">
    <h1>Shay Nassi AiWorks - גלריה</h1>
    <div id="loader" class="loader">מחפש קבצים...</div>
    <div id="gallery" class="gallery"></div>
    <div id="empty" class="empty" style="display:none">לא נמצאו קבצים.</div>
  </div>

  <div id="modal" class="modal">
    <div class="modal-content">
        <span id="closeBtn" class="close">✕</span>
        <img id="modalImg" style="display:none">
        <video id="modalVideo" controls style="display:none"></video>
    </div>
  </div>

  <script>
    (function(){
      const owner = 'sn1983';
      const repo = 'ShayNassiAiWorks.github.io';
      const branch = 'main';
      
      const imgRE = /\.(png|jpe?g|gif|webp|svg)$/i;
      const vidRE = /\.(mp4|webm|ogg|mov)$/i;

      async function listContents(path = ''){
        const api = `https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`;
        const res = await fetch(api);
        return res.json();
      }

      async function gatherFiles(path = ''){
        const items = await listContents(path);
        let files = [];
        const list = Array.isArray(items) ? items : [items];
        
        for(const it of list){
          if(it.type === 'file'){
            const isImg = imgRE.test(it.name);
            const isVid = vidRE.test(it.name);
            if(isImg || isVid){
              files.push({
                name: it.path, 
                url: `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${encodeURI(it.path)}`,
                type: isImg ? 'image' : 'video'
              });
            }
          } else if(it.type === 'dir'){
            files = files.concat(await gatherFiles(it.path));
          }
        }
        return files;
      }

      function makeItem(file){
        const wrap = document.createElement('div');
        wrap.className = 'item' + (file.type === 'video' ? ' video-badge' : '');
        
        let media;
        if(file.type === 'image'){
            media = document.createElement('img');
            media.src = file.url;
            media.loading = 'lazy';
        } else {
            media = document.createElement('video');
            media.src = file.url + "#t=0.1"; // טוען פריים ראשון כתמונה מקדימה
            media.muted = true;
            media.playsInline = true;
        }
        
        wrap.appendChild(media);
        wrap.onclick = () => openModal(file);
        return wrap;
      }

      function openModal(file){
        const modal = document.getElementById('modal');
        const mImg = document.getElementById('modalImg');
        const mVid = document.getElementById('modalVideo');

        mImg.style.display = 'none';
        mVid.style.display = 'none';
        mVid.pause();

        if(file.type === 'image'){
            mImg.src = file.url;
            mImg.style.display = 'block';
        } else {
            mVid.src = file.url;
            mVid.style.display = 'block';
            mVid.play();
        }
        modal.classList.add('open');
      }

      function closeModal(){
        const modal = document.getElementById('modal');
        document.getElementById('modalVideo').pause();
        modal.classList.remove('open');
      }

      document.getElementById('closeBtn').onclick = closeModal;
      window.onclick = (e) => { if(e.target.id === 'modal') closeModal(); };

      async function init(){
        try {
          const files = await gatherFiles('');
          document.getElementById('loader').style.display = 'none';
          if(!files.length) { document.getElementById('empty').style.display = 'block'; return; }
          
          files.sort((a,b) => a.name.localeCompare(b.name));
          files.forEach(f => document.getElementById('gallery').appendChild(makeItem(f)));
        } catch(e) { 
          document.getElementById('loader').textContent = 'שגיאה בטעינה';
        }
      }

      init();
    })();
  </script>
</body>
</html>
